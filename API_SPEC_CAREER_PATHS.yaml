openapi: 3.1.0
info:
  title: Career Paths Explorer API
  description: APIs to support the Career Paths Explorer feature; includes recommendations, career details, favorites and admin operations.
  version: "1.0.0"
servers:
  - url: /api
paths:
  /careers:
    get:
      summary: List careers
      description: Retrieve a paginated list of careers with optional filters. Use 'sort=recommended' when you want AI ranking applied.
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: pageSize
          schema:
            type: integer
            default: 20
        - in: query
          name: search
          schema:
            type: string
        - in: query
          name: industry
          schema:
            type: string
        - in: query
          name: interest
          schema:
            type: string
        - in: query
          name: education
          schema:
            type: string
        - in: query
          name: location
          schema:
            type: string
        - in: query
          name: sort
          schema:
            type: string
            enum: [recommended, match, title, demand]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CareerListResponse'
  /careers/{careerId}:
    get:
      summary: Get career details
      parameters:
        - in: path
          name: careerId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Career details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CareerDetail'
  /careers/recommendations:
    post:
      summary: Get personalized career recommendations for a user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecommendationRequest'
      responses:
        '200':
          description: Recommendations
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecommendationResponse'
  /users/{userId}/favorites:
    get:
      summary: Get user favorites
      parameters:
        - in: path
          name: userId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Favorites list
          content:
            application/json:
              schema:
                type: object
                properties:
                  favorites:
                    type: array
                    items:
                      type: string
    post:
      summary: Add to favorites
      parameters:
        - in: path
          name: userId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                careerId:
                  type: string
      responses:
        '201':
          description: Created
  /users/{userId}/favorites/{careerId}:
    delete:
      summary: Remove favorite
      parameters:
        - in: path
          name: userId
          required: true
          schema:
            type: string
        - in: path
          name: careerId
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Deleted
  /careers/compare:
    post:
      summary: Prepare data to compare careers
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                careerIds:
                  type: array
                  items:
                    type: string
      responses:
        '200':
          description: Comparison data
components:
  schemas:
    CareerRole:
      type: object
      required:
        - id
        - title
      properties:
        id:
          type: string
          description: Unique identifier for the career
        familyId:
          type: string
          description: Career family grouping identifier
        slug:
          type: string
          description: URL-friendly slug for the career
        title:
          type: object
          required:
            - en
          properties:
            en:
              type: string
              description: Career title in English
            es:
              type: string
              description: Career title in Spanish
        shortDescription:
          type: object
          properties:
            en:
              type: string
              description: Brief description in English
            es:
              type: string
              description: Brief description in Spanish
        longDescription:
          type: object
          properties:
            en:
              type: string
              description: Detailed description in English
            es:
              type: string
              description: Detailed description in Spanish
        responsibilities:
          type: array
          description: List of key responsibilities
          items:
            type: object
            properties:
              en:
                type: string
              es:
                type: string
        skills:
          type: array
          description: Required skills for the role
          items:
            type: object
            required:
              - skillId
              - name
            properties:
              skillId:
                type: string
                description: Unique skill identifier
              name:
                type: object
                properties:
                  en:
                    type: string
                  es:
                    type: string
              levelRequired:
                type: string
                enum: [beginner, intermediate, advanced]
                description: Proficiency level required
        educationLevel:
          type: string
          enum:
            - HighSchool
            - Associate
            - Bachelors
            - Masters
            - PhD
          description: Minimum education level required
        salaryRange:
          type: object
          description: Salary information
          properties:
            min:
              type: number
              description: Minimum annual salary
            median:
              type: number
              description: Median annual salary
            max:
              type: number
              description: Maximum annual salary
            currency:
              type: string
              default: USD
              description: Currency code (ISO 4217)
        demandStats:
          type: object
          description: Job market demand statistics
          properties:
            jobCount:
              type: number
              description: Total open positions
            postedLast30Days:
              type: number
              description: New jobs posted in last 30 days
            growthPercent:
              type: number
              description: Annual growth rate (0.07 = 7%)
        industries:
          type: array
          description: Industries where this role is common
          items:
            type: string
        locationSupport:
          type: array
          description: Supported locations/regions
          items:
            type: string
        iconUrl:
          type: string
          description: URL to career icon/image
        remoteEligible:
          type: boolean
          description: Whether remote work is available
        matchScore:
          type: number
          minimum: 0
          maximum: 100
          description: User match percentage (0-100)
        published:
          type: boolean
          description: Whether career is visible to users
    CareerListResponse:
      type: object
      properties:
        careers:
          type: array
          items:
            $ref: '#/components/schemas/CareerRole'
        meta:
          type: object
          properties:
            total:
              type: integer
            page:
              type: integer
            pageSize:
              type: integer
    CareerDetail:
      type: object
      allOf:
        - $ref: '#/components/schemas/CareerRole'
        - type: object
          properties:
            recommendedReasoning:
              type: object
              properties:
                en:
                  type: string
                es:
                  type: string
            trendingScore:
              type: number
    RecommendationRequest:
      type: object
      properties:
        userId:
          type: string
        context:
          type: object
          properties:
            assessmentId:
              type: string
            assessmentScores:
              type: object
            interestProfile:
              type: object
            location:
              type: string
            educationLevel:
              type: string
            weighting:
              type: object
    RecommendationResponse:
      type: object
      properties:
        recommendations:
          type: array
          items:
            type: object
            properties:
              careerId:
                type: string
              matchScore:
                type: number
              explanation:
                type: object
                properties:
                  en:
                    type: string
                  es:
                    type: string
        engineMeta:
          type: object
          properties:
            engine:
              type: string
            timestamp:
              type: string
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
security:
  - bearerAuth: []
